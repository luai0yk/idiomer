name: idiomer
description: "Idiomer application."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.5
  phone_numbers_parser: ^9.0.24
  skeletonizer: ^2.1.0
  iconsax_flutter: 1.0.1

  # Media
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  path_provider: ^2.1.6
  photo_view: ^0.15.0
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1

  # Sharing & Utilities
  url_launcher: ^6.3.2
  share_plus: ^12.0.1

  flutter_localizations:
    sdk: flutter
  intl: any

  # App Startup
  flutter_native_splash: ^2.4.7
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  go_router: ^17.5.0
  get_it: ^9.3.0
  dio: ^5.11.1
  connectivity_plus: ^7.3.1
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  path: ^1.9.1
  koni_archive: ^0.9.0
  stream_transform: ^2.1.2
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App Icons
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
